services:
  # ── Backend (API + BullMQ Worker) ─────────────────────────
  # Database: use Neon (PostgreSQL)   — set DATABASE_URL in .env
  # Cache:    use Upstash (Redis)     — set REDIS_URL in .env
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:4000
    restart: always
    healthcheck:
      test: curl -f http://localhost:4000/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Frontend (Next.js 15) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: always

# All data is stored externally:
#   PostgreSQL → Neon (cloud)
#   Redis      → Upstash (cloud)
# No local volumes needed.
