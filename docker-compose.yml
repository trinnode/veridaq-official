version: "3.9"

# VERIDAQ local development stack.
# Runs PostgreSQL 16 and Redis 7.
# Your backend and frontend run outside Docker (on your machine).
# Start with: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: veridaq_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: veridaq
      POSTGRES_PASSWORD: veridaq_dev
      POSTGRES_DB: veridaq
    ports:
      - "5432:5432"
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridaq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veridaq_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - .docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Uncomment to run pgAdmin for database inspection
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@veridaq.xyz
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres
