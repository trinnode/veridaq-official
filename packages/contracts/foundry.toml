[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
test     = "test"
script   = "script"
solc     = "0.8.28"
optimizer       = true
optimizer_runs  = 200
via_ir          = false
ffi             = false

[profile.default.fuzz]
runs    = 1000
seed    = "0xdeadbeef"

[profile.default.invariant]
runs    = 256
depth   = 32

[rpc_endpoints]
base_sepolia = "${ALCHEMY_BASE_SEPOLIA_URL}"

[etherscan]
# Etherscan V2 multichain API — the V1 basescan.org endpoint was retired.
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=84532" }

[fmt]
line_length   = 100
tab_width     = 4
quote_style   = "double"
bracket_spacing = true
