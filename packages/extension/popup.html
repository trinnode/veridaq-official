<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VERIDAQ Companion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" data-host="popup">
    <!-- Header -->
    <header class="app-header">
      <a class="brand" href="#" data-action="open-app">
        <img class="brand-icon" src="logo.svg" alt="VERIDAQ" />
        <span class="brand-text">VERIDAQ</span>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" data-action="theme-toggle" title="Toggle theme"></button>
      </div>
    </header>

    <!-- Status Bar (authenticated only) -->
    <section class="status hidden" data-status>
      <div class="status-indicator" data-status-indicator></div>
      <div class="status-content">
        <div class="status-label">Session</div>
        <div class="status-value" data-status-text>Signed in</div>
        <div class="status-user" data-status-user></div>
      </div>
      <button class="icon-btn danger" data-action="logout" title="Sign out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </section>

    <!-- Login Section (not authenticated) -->
    <section class="login-section" data-section="login">
      <div class="login-card animate-fade-in">
        <div class="role-tabs" data-role-tabs>
          <button class="role-tab active" data-role="INSTITUTION">Institution</button>
          <button class="role-tab" data-role="EMPLOYER">Employer</button>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" data-login-email placeholder="Enter your email" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" data-login-password placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <p class="login-error" data-login-error></p>
        <button class="login-btn" data-action="login">
          <svg class="hidden" data-login-spinner class="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="32"/>
          </svg>
          <span data-login-text>Sign In</span>
        </button>
        <p class="login-footer">
          <a href="#" data-action="open-app">Open full app</a>
        </p>
      </div>
    </section>

    <!-- Authenticated Content -->
    <section class="panel hidden" data-section="dashboard">
      <!-- Navigation Tabs -->
      <nav class="tabs" data-dashboard-tabs>
        <button class="tab active" data-tab="quick">Actions</button>
        <button class="tab" data-tab="dashboard">Activity</button>
      </nav>

      <!-- Quick Actions -->
      <div class="panel" data-panel="quick">
        <!-- Credit Balance (employer) -->
        <div class="panel-block credits-card hidden" data-credits-card>
          <div class="panel-block-header">
            <h3>Credits</h3>
            <span class="badge badge-info">Employer</span>
          </div>
          <div class="credits-row">
            <div class="credit-metric">
              <span class="credit-value" data-credit-free>0</span>
              <span class="credit-label">Free</span>
            </div>
            <div class="credit-divider"></div>
            <div class="credit-metric">
              <span class="credit-value" data-credit-paid>0</span>
              <span class="credit-label">Paid</span>
            </div>
            <div class="credit-divider"></div>
            <div class="credit-metric">
              <span class="credit-value accent" data-credit-total>0</span>
              <span class="credit-label">Total</span>
            </div>
          </div>
          <button class="btn btn-primary btn-full btn-sm" data-action="buy-credits">Buy Credits</button>
          <p class="status-msg" data-credit-status></p>
        </div>

        <!-- Upload Batch (institution) -->
        <div class="panel-block hidden" data-panel-upload>
          <div class="panel-block-header">
            <h3>Upload Batch</h3>
            <span class="badge badge-accent">Institution</span>
          </div>
          <div class="upload-zone" data-upload-zone>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>Drop .xlsx or <strong>browse</strong></span>
            <input type="file" data-upload-file accept=".xlsx" class="file-input" />
          </div>
          <button class="btn btn-primary btn-sm btn-full" data-action="upload">Upload</button>
          <p class="status-msg" data-upload-status></p>
        </div>

        <!-- Verify Credential (employer) -->
        <div class="panel-block hidden" data-panel-verify>
          <div class="panel-block-header">
            <h3>Verify Credential</h3>
            <span class="badge badge-info">Employer</span>
          </div>
          <input class="input" type="text" data-verify-inst placeholder="Institution on-chain ID" />
          <input class="input" type="text" data-verify-matric placeholder="Matric number" />
          <div class="input-row">
            <input class="input" type="number" data-verify-claim placeholder="Claim type" />
            <input class="input" type="number" data-verify-threshold placeholder="Threshold" />
          </div>
          <button class="btn btn-primary btn-sm btn-full" data-action="verify">Verify</button>
          <p class="status-msg" data-verify-status></p>
        </div>


      </div>

      <!-- Dashboard / Recent Activity -->
      <div class="panel hidden" data-panel="dashboard">
        <div class="panel-block">
          <div class="panel-block-header">
            <h3>Recent Activity</h3>
            <button class="btn btn-ghost btn-sm" data-action="refresh-dashboard">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
            </button>
          </div>
          <ul class="list" data-dashboard-list></ul>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <span>v1.0.0 · Base Sepolia</span>
      <a href="#" data-action="open-app">Dashboard</a>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="ui.js"></script>
</body>
</html>
